services:
  - type: web
    name: HokieConnect
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: USER_DATABASE_URL
        fromDatabase:
          name: user-database        # must match a name under databases:
          property: connectionString
      - key: EVENTS_DATABASE_URL
        fromDatabase:
          name: events-database
          property: connectionString

databases:
  - name: info-database
    plan: basic-256mb
    databaseName: user_db
    postgresMajorVersion: "16"