services:
  - type: web
    name: HokieConnect
    runtime: node
    plan: Pro
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: USER_DATABASE_URL
        fromDatabase:
          name: user-database        # must match a name under databases:
          property: connectionString
      - key: EVENTS_DATABASE_URL
        fromDatabase:
          name: events-database
          property: connectionString

databases:
  - name: user-database
    plan: Pro
    databaseName: user_db
    postgresMajorVersion: "16"
  - name: events-database
    plan: free
    databaseName: events_db
    postgresMajorVersion: "16"
