services:
  - type: web
    name: my-web-app
    runtime: node # change to python, docker, go, etc.
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-database
          property: connectionString

databases:
  - name: user-database
    plan: free
    databaseName: user_db
    postgresMajorVersion: "16"
  - name: 
    plan: free
    databaseName: events_db
    postgresMajorVersion: "16"