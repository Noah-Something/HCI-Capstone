<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HokieConnect – Groups</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="logo">HokieConnect</a>
    <div class="nav-links">
      <a href="home.html">Discover</a>
      <a href="events.html">Events</a>
      <a href="hokies.html">Hokies</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="messages.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <div class="page">
    <div class="events-header">
      <div>
        <h1>Groups</h1>
        <p class="gray">Join or create Hokie groups for running, yoga, game days, and more.</p>
      </div>
      <a href="create-group.html" class="btn btn-maroon">+ Create group</a>
    </div>

    <!-- All groups, or only the ones the user is in -->
    <div class="filters" role="tablist">
      <button class="filter active" data-view="all" role="tab">All groups</button>
      <button class="filter" data-view="mine" role="tab">My groups</button>
    </div>

    <div class="group-filters">
      <label>Search
        <input id="groupSearch" class="input" type="search" placeholder="Group name or description">
      </label>
      <label>Category
        <select id="groupCategory" class="input">
          <option value="">Any category</option>
        </select>
      </label>
    </div>

    <p id="groupCount" class="gray"></p>
    <div id="groupList" class="event-grid"></div>
  </div>

  <script src="events.js"></script>
  <script src="groups.js"></script>
  <script src="groups-page.js"></script>
</body>
</html>
