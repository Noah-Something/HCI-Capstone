<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HokieConnect – Group</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="logo">HokieConnect</a>
    <div class="nav-links">
      <a href="home.html">Discover</a>
      <a href="events.html">Events</a>
      <a href="hokies.html">Hokies</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="messages.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <div class="page">
    <a href="groups.html"><b>← Back to Groups</b></a>

    <div class="card event-detail">
      <div class="event-top" id="groupCategory"></div>
      <div class="event-info">
        <h1 id="groupName">Loading…</h1>
        <p class="gray" id="groupCounts"></p>
        <p id="groupDescription" class="event-description"></p>

        <div class="group-actions">
          <button id="membershipButton" class="btn btn-maroon" hidden></button>
          <!-- Only admins can host events for the group -->
          <a id="createGroupEvent" class="btn" hidden>+ Create event for this group</a>
        </div>
        <p id="groupStatus"></p>

        <div class="attendees">
          <h2>Upcoming events</h2>
          <div id="groupEvents"></div>
        </div>

        <div class="attendees">
          <h2>Members</h2>
          <ul id="memberList" class="attendee-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="events.js"></script>
  <script src="groups.js"></script>
  <script src="group.js"></script>
</body>
</html>
