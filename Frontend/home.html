<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HokieConnect - Home</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="motion.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="logo">HokieConnect</a>
    <div class="nav-links">
      <a href="home.html" class="active">Discover</a>
      <a href="events.html">Events</a>
      <a href="hokies.html">Hokies</a>
      <a href="groups.html">Groups</a>
      <a href="messages.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <div class="page">
    <p class="gray">Welcome back!</p>
    <h1>Discover</h1>

    <div class="home-layout">

      <!-- LEFT: events -->
      <div>
        <div class="events-header">
          <h2>Recommended for you</h2>
          <a href="events.html"><b>See all events →</b></a>
        </div>
        <p class="gray" style="margin:0 0 4px">Upcoming events picked from your interests, location and what's coming up soon.</p>

        <!-- app.js adds a button for each category in the recommended events -->
        <div id="categoryFilters" class="filters"></div>

        <!-- app.js puts the event cards in here -->
        <div id="eventList" class="event-grid"></div>
      </div>

      <!-- RIGHT: side panel -->
      <div>
        <!-- app.js fills this in from /api/hokies -->
        <a id="connectionCard" href="hokies.html" class="card connection-card">
          <p class="connection-label">YOUR FIRST CONNECTION</p>
          <h2 id="connectionHeadline">Finding Hokies near you ...</h2>
          <div id="connectionMatch"></div>
          <p id="connectionAction" class="connection-action">See all Hokies →</p>
        </a>
      </div>

    </div>
  </div>
  <script src="events.js"></script>
  <script src="app.js"></script>
</body>
</html>
