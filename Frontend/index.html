<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HokieConnect - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-page">
        <div class="login-left">
            <p><b>HokieConnect</b></p>
            <h1>Same Hokies.<br>New City.</h1>
            <p>Find fellow Hokies, wellness meetups,events, and your new home in the D.C. area</p>
        </div>

        <div class="login-right">
            <h2> Sign in</h2>
            <form id="loginForm">
                <label for="username"> Username</label>
                <input id="username" class="input" type="text" placeholder="testUser" required>

                <label for="password"> Password</label>
                <input id="password" class="input" type="password" placeholder="********" required>

                <button type="submit" class="btn btn-maroon" style="width:100%">Sign in</button>

            </form>
        
            <p id="loginStatus"></p>
            <p class="gray"> New here? <a href="signup.html"><b>Create an account</b></a></p>
        </div>

    </div>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            loginStatus.textContent = 'Signing in ...'

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();

                if (response.ok) {
                    // Login successful
                    sessionStorage.setItem('authToken', data.token); 
                    window.location.href = 'home.html';
                   
                } else {
                    // Login failed
                    loginStatus.textContent = data.message || 'Login failed.';
                    loginStatus.style.color = 'red';
                }
            } catch (error) {
                loginStatus.textContent = 'Could not reach the login server. Is server.js running?';
                loginStatus.style.color = 'red';
            }
        });
    </script>
</body>
</html>
